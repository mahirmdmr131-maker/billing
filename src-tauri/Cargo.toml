
[package]
name = "am-food-processing-manager"
version = "1.0.0"
description = "Tauri Backend for AM Food Manager"
authors = ["AM Food Processing"]
edition = "2021"
rust-version = "1.60"

[build-dependencies]
tauri-build = { version = "1.5" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "1.6", features = ["api-all"] }

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `custom-protocol` and `dev-server`
default = [ "custom-protocol" ]
custom-protocol = [ "tauri/custom-protocol" ]
